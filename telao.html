<!doctype html>
<html lang="pt-BR" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telão da votação · Ric Gameplays</title>
<link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
<link rel="stylesheet" href="/css/sistema.css">
<style>
  /* Telão: 1920x1080 fixo, sempre no modo claro, sem topo e sem rodapé (vai inteiro para a live).
     O canto superior direito fica livre para a câmera. Em janela menor, ele encolhe inteiro para caber. */
  html, body { margin: 0; overflow: hidden; background: var(--bg); }
  body { animation: none; }
  .tela { width: 1920px; height: 1080px; padding: 96px 112px; display: flex; flex-direction: column; gap: 52px; transform-origin: 0 0; position: absolute; left: 0; top: 0; }
  .tela-topo { display: flex; align-items: center; gap: 18px; margin-bottom: 30px; }
  .tela-voltar { font-size: 20px; font-weight: 600; color: var(--muted); text-decoration: none; }
  .tela-selo { display: inline-flex; align-items: center; gap: 9px; padding: 7px 15px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 16px; font-weight: 700; text-transform: uppercase; }
  .tela-selo i { width: 9px; height: 9px; border-radius: 999px; background: var(--accent); }
  .tela h1 { font-size: 116px; }
  .tela-corpo { flex: 1 1 auto; display: flex; gap: 52px; min-height: 0; }

  .t-ranking { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .t-rank { flex: 1 1 0; max-height: 132px; min-height: 0; display: grid; grid-template-columns: 56px 128px minmax(0, 1fr) 150px; align-items: center; gap: 24px; padding: 8px 20px; border-radius: 16px; transition: background-color .3s ease; }
  .t-rank--lider { background: var(--surface-2); }
  .t-pos { font-family: var(--fonte-titulo); font-size: 46px; color: var(--muted); text-align: center; line-height: 1; }
  .t-rank--lider .t-pos { color: var(--text); }
  .t-rank .capa { border-radius: 8px; }
  .t-meio { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
  .t-nome { font-size: 28px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .t-fila { font-size: 15px; font-weight: 600; color: var(--accent); }
  .t-trilho { display: block; height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
  .t-rank--lider .t-trilho { background: var(--bg); }
  .t-trilho i { position: relative; display: block; height: 100%; width: 0; border-radius: 99px; background: var(--border); overflow: hidden; transition: width .8s cubic-bezier(.2,.8,.2,1); }
  .t-rank--lider .t-trilho i { background: var(--accent); box-shadow: 0 0 14px rgba(196,32,60,.45); }
  .t-rank--lider .t-trilho i::after { content: ""; position: absolute; inset: 0; width: 40%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent); animation: brilho-barra 2.4s ease-in-out infinite; }
  .t-votos { display: flex; flex-direction: column; align-items: flex-end; }
  .t-numero { font-family: var(--fonte-titulo); font-size: 60px; line-height: .9; }
  .t-numero.mostrando-nome { font-family: var(--fonte-texto); font-size: 26px; font-weight: 700; line-height: 1.6; }
  .t-pct { font-size: 15px; color: var(--muted); }
  .voto-subiu .t-pct { animation: pct-pulo .6s cubic-bezier(.2,.8,.2,1); }

  .t-lado { flex: 0 0 480px; width: 480px; display: flex; flex-direction: column; gap: 20px; min-height: 0; }
  .t-cartao { border-radius: 18px; background: var(--surface); border: 1px solid var(--border); overflow: hidden; }
  .t-cartao .capa { border: 0; border-radius: 0; }
  .t-lider-txt { padding: 20px 24px; }
  .t-rotulo { font-size: 15px; font-weight: 700; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .t-lider-nome { font-family: var(--fonte-titulo); font-size: 46px; line-height: .95; margin-bottom: 6px; }
  .t-lider-info { font-size: 17px; color: var(--muted); }
  .t-feed { flex: 1 1 auto; min-height: 0; padding: 20px 24px; overflow: hidden; }
  .t-feed-topo { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
  .t-total { font-family: var(--fonte-titulo); font-size: 40px; line-height: 1; }
  .t-feed li { display: flex; align-items: center; gap: 14px; padding: 11px 0; border-top: 1px solid var(--border); font-size: 18px; }
  .t-feed .feed-inicial { width: 32px; height: 32px; font-size: 14px; }
  .t-feed .chip-n { margin-left: auto; font-size: 14px; }

  /* frequentes: vitrine de capas */
  .t-vitrine { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: 28px; align-content: center; }
  .t-vitrine .capa-jogo strong { font-size: 24px; }
  .t-vitrine .capa-jogo > span:last-child { font-size: 17px; }
</style>
</head>
<body>
<div class="tela" id="tela">
  <div>
    <div class="tela-topo">
      <a class="tela-voltar" href="/" id="voltar">← Voltar para o site</a>
      <span class="tela-selo" id="selo"><i></i>Contando ao vivo</span>
    </div>
    <h1 id="titulo">Qual a próxima série?</h1>
  </div>
  <div class="tela-corpo" id="corpo">
    <ul class="t-ranking" id="ranking"></ul>
    <div class="t-lado">
      <div class="t-cartao">
        <div class="capa" id="liderCapa"><span class="capa-reserva">Nenhum voto ainda</span></div>
        <div class="t-lider-txt">
          <p class="t-rotulo" id="liderRotulo">Na frente</p>
          <p class="t-lider-nome" id="liderNome">Nenhum voto ainda</p>
          <p class="t-lider-info" id="liderInfo">O primeiro voto abre a corrida.</p>
        </div>
      </div>
      <div class="t-cartao t-feed">
        <div class="t-feed-topo"><p class="t-rotulo">Últimos votos</p><span><span class="t-total" id="total">0</span> <span style="font-size: 15px; color: var(--muted)">votos no total</span></span></div>
        <ul id="feed"></ul>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { conectar, ordenar, porcentagemMeta, LISTA, LOCAL } from "/js/ao-vivo.js";
import { esc } from "/js/componentes.js";
import { contar, antesDeReordenar } from "/js/animacoes.js";
import { capaHTML, capaJogo, ordenarFrequentes, agruparVotos, textoVotos } from "/js/util.js";
import { Roleta } from "/js/roleta.js";

const $ = id => document.getElementById(id);
// no PC (o que vai para a live) não tem "voltar"; no site tem
if (LOCAL) $("voltar").remove();

// em janela menor que 1920x1080, o telão encolhe inteiro para caber
function caber() { const k = Math.min(innerWidth / 1920, innerHeight / 1080); $("tela").style.transform = k < 1 ? `scale(${k})` : ""; }
addEventListener("resize", caber); caber();

const FREQUENTES = LISTA === "frequentes";
if (FREQUENTES) {
  $("titulo").textContent = "Os jogos de sempre";
  $("selo").innerHTML = "<i></i>Sempre no canal";
  $("corpo").innerHTML = `<div class="t-vitrine" id="vitrine"></div>`;
}

const linhas = new Map();
function ranking(opcoes) {
  const box = $("ranking");
  const ordem = ordenar(opcoes);
  const deslizar = antesDeReordenar(box);
  const ids = new Set(ordem.map(j => j.id));
  for (const [id, l] of linhas) if (!ids.has(id)) { l.el.remove(); linhas.delete(id); }
  ordem.forEach((j, i) => {
    let l = linhas.get(j.id);
    if (!l) {
      const el = document.createElement("li");
      el.className = "t-rank";
      el.innerHTML = `<span class="t-pos"></span><span class="t-capa"></span>
        <div class="t-meio"><span class="t-nome"></span><span class="t-trilho"><i></i></span></div>
        <div class="t-votos"><span class="t-numero"></span><span class="t-pct"><span class="n"></span>% da meta</span></div>`;
      l = { el, roleta: new Roleta(el.querySelector(".t-numero")) };
      linhas.set(j.id, l);
    }
    const { el } = l;
    const pct = porcentagemMeta(j);
    const antes = Number(el.dataset.votos ?? j.votos);
    el.dataset.votos = j.votos;
    if (j.votos > antes) { el.classList.remove("voto-subiu"); void el.offsetWidth; el.classList.add("voto-subiu"); }
    el.classList.toggle("t-rank--lider", i === 0 && j.votos > 0);
    el.querySelector(".t-pos").textContent = i + 1;
    el.querySelector(".t-nome").textContent = j.ordemMeta != null ? `${j.nome}` : j.nome;
    const capa = el.querySelector(".t-capa");
    if (capa.dataset.url !== (j.capa || "")) { capa.dataset.url = j.capa || ""; capa.innerHTML = capaHTML(j.capa, j.nome); }
    el.querySelector(".t-trilho i").style.width = pct + "%";
    contar(el.querySelector(".t-pct .n"), pct);
    l.roleta.definir(j.votos);
    box.appendChild(el);
  });
  deslizar();
  return ordem;
}
function lider(ordem) {
  const [a, b] = ordem;
  if (!a || !a.votos) return;
  const url = a.fundo || a.capa || "";
  const capa = $("liderCapa");
  if (capa.dataset.url !== url) { capa.dataset.url = url; capa.innerHTML = capaHTML(url, a.nome).replace(/^<span class="capa">|<\/span>$/g, ""); }
  $("liderRotulo").textContent = a.ordemMeta != null ? "Meta batida · próxima da fila" : "Na frente";
  $("liderNome").textContent = a.nome;
  $("liderInfo").textContent = `${a.votos} de ${a.metaVotos} votos da meta (${porcentagemMeta(a)}%)` + (b ? ` · ${a.votos - b.votos} à frente da segunda` : "");
}
let recentes = [], assinatura = "";
function feed(destacar) {
  const grupos = agruparVotos(recentes).slice(0, 7);
  const a = JSON.stringify(grupos.map(g => [g.quem, g.jogoId, g.total]));
  if (!destacar && a === assinatura) return;
  assinatura = a;
  $("feed").innerHTML = grupos.map(g => `
    <li class="${destacar && g.quem === destacar.quem && g.jogoId === destacar.jogoId ? "feed--novo" : ""}">
      <span class="feed-inicial">${esc((g.quem || "?").slice(0, 1).toUpperCase())}</span>
      <span class="feed-texto"><b>${esc(g.quem)}</b> votou em <b>${esc(g.jogo)}</b></span>
      <span class="chip-n">${textoVotos(g.total)}</span>
    </li>`).join("");
}

let assinaturaVitrine = "";
conectar({
  aoEstado: s => {
    if (FREQUENTES) {
      const lista = ordenarFrequentes(s.opcoes || []).slice(0, 8); // duas linhas de 4 capas 16:9
      const a = JSON.stringify(lista.map(j => [j.id, j.capaVertical, j.capa]));
      if (a !== assinaturaVitrine) { assinaturaVitrine = a; $("vitrine").style.setProperty("--n", 4); $("vitrine").innerHTML = lista.map(capaJogo).join(""); }
      return;
    }
    lider(ranking(s.opcoes || []));
    contar($("total"), s.total || 0);
    recentes = (s.ultimos || []).slice();
    feed();
  },
  aoVoto: v => {
    if (FREQUENTES || (v.lista || "principal") !== "principal") return;
    linhas.get(v.jogoId)?.roleta.votar(v.quem, v.votos);
    recentes = [{ quem: v.quem, jogoId: v.jogoId, jogo: v.jogo, n: v.n, t: v.t }, ...recentes.filter(u => u.t !== v.t)].slice(0, 30);
    feed(v);
  }
});
</script>
</body>
</html>
