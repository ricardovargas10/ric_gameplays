<!doctype html>
<html lang="pt-BR" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblioteca · Todos os jogos do canal · Ric Gameplays</title>
<meta name="description" content="A biblioteca inteira do canal Ric Gameplays: todos os jogos que o Ric tem, quer jogar ou já jogou, com gênero, ano e se estão na votação.">
<link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
<link rel="apple-touch-icon" href="/img/ric.webp">
<script src="/js/tema.js"></script>
<link rel="stylesheet" href="/css/sistema.css">
<script type="module" src="/js/componentes.js"></script>
</head>
<body>
<ric-topo pagina="biblioteca"></ric-topo>

<main>
  <section class="container pagina-topo">
    <p class="olho">Tudo o que está na lista</p>
    <h1 class="pagina-titulo">A biblioteca inteira do canal.</h1>
    <p class="lead">Todos os jogos que eu tenho, quero jogar ou já joguei, com gênero, ano e se estão na votação. Dá para buscar e filtrar.</p>
  </section>

  <section class="container" style="padding-bottom: var(--e-9)">
    <div class="biblioteca-controles">
      <label class="busca">
        <span class="rotulo">Buscar jogo</span>
        <input class="campo" type="search" id="busca" placeholder="Nome do jogo" autocomplete="off">
      </label>
      <div class="linha" id="filtros" role="group" aria-label="Filtrar jogos"></div>
    </div>
    <div class="linha filtros-generos" id="generos" role="group" aria-label="Filtrar por gênero" style="margin-bottom: var(--e-5)">
    </div>

    <div class="tabela-caixa biblioteca-tabela">
      <div class="tabela-rolagem">
        <table>
          <thead>
            <tr>
              <th scope="col"><button type="button" class="ordenar" data-ordem="nome">Jogo</button></th>
              <th scope="col">Gêneros</th>
              <th scope="col"><button type="button" class="ordenar" data-ordem="ano">Lançamento</button></th>
              <th scope="col"><button type="button" class="ordenar" data-ordem="tem">Já tem</button></th>
              <th scope="col"><button type="button" class="ordenar" data-ordem="votacao">Na votação</button></th>
            </tr>
          </thead>
          <tbody id="corpo"><tr><td colspan="5" style="color: var(--muted)">Carregando a lista…</td></tr></tbody>
        </table>
      </div>
    </div>
    <ul class="biblioteca-lista" id="listaCelular"></ul>
    <p class="biblioteca-conta" id="conta"></p>
  </section>

  <section class="container" style="padding-bottom: var(--e-9)"><ric-discord></ric-discord></section>
  <section class="secao-patrocinio container" style="padding-bottom: var(--e-9)"><ric-patrocinio></ric-patrocinio></section>
</main>

<ric-rodape></ric-rodape>

<script type="module" src="/js/pagina-biblioteca.js"></script>
</body>
</html>
